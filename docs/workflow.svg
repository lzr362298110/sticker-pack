    <path d="m16 12 11 8-12 6Zm45 0-12 8 12 6Z" fill="#ed8c76"/>
    <path d="M31 17q5-3 10 0l-2 10-4 3-4-3Z" fill="#fff5e4"/>
    <ellipse cx="18" cy="47" rx="5" ry="2.5" fill="#ed8c76"/><ellipse cx="54" cy="47" rx="5" ry="2.5" fill="#ed8c76"/>
    <path d="M32 44q4-2 8 0l-4 4Z" fill="#222423"/>
  </symbol>
  <symbol id="smile" viewBox="0 0 72 66"><use href="#head"/><path d="M18 38q5-8 10 0m16 0q5-8 10 0M28 49q8 13 16 0" stroke="#222423" stroke-width="3" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="wow" viewBox="0 0 72 66"><use href="#head"/><circle cx="23" cy="36" r="7" fill="#fffaf2"/><circle cx="49" cy="36" r="7" fill="#fffaf2"/><circle cx="23" cy="36" r="3" fill="#222423"/><circle cx="49" cy="36" r="3" fill="#222423"/><ellipse cx="36" cy="53" rx="4" ry="5" fill="#222423"/></symbol>
  <symbol id="sleep" viewBox="0 0 72 66"><use href="#head"/><path d="M18 38q5 5 10 0m16 0q5 5 10 0m-21 15h6" stroke="#222423" stroke-width="3" stroke-linecap="round" fill="none"/></symbol>
</defs>
<rect width="1200" height="540" rx="34" fill="#fbf4e8"/>
<rect x="28" y="28" width="1144" height="484" rx="25" fill="url(#dot)"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#222423">
  <rect x="55" y="49" width="128" height="29" rx="14.5" fill="#23584c"/>
  <text x="119" y="68" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#fff6e8">AGENT SKILL</text>
  <text x="54" y="154" font-size="82" font-weight="800" letter-spacing="-4">Sticker Pack</text>
  <text x="59" y="193" font-size="22" fill="#5c5c50">Turn one character into a sheet of reactions.</text>
  <g transform="translate(56 231)">
    <rect width="240" height="220" rx="22" fill="#fffdf7" stroke="#e4d5c3"/>
    <text x="19" y="29" font-size="13" fill="#23584c" font-weight="700" letter-spacing="1.4">01  CHARACTER</text>
    <rect x="63" y="48" width="114" height="114" rx="22" fill="#f8e7ca"/>
    <use href="#smile" x="76" y="62" width="88" height="81"/>
    <text x="19" y="194" font-size="16" font-weight="700">Start with an image</text>
  </g>
  <g transform="translate(338 231)">
    <rect width="240" height="220" rx="22" fill="#fffdf7" stroke="#e4d5c3"/>
    <text x="19" y="29" font-size="13" fill="#23584c" font-weight="700" letter-spacing="1.4">02  STYLE PROMPT</text>
    <rect x="64" y="48" width="112" height="114" rx="15" fill="#deeee4"/>
    <path d="M82 78h52M82 96h72M82 114h58M82 132h37" stroke="#23584c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="151" cy="78" r="4" fill="#ec8d73"/>
    <text x="19" y="194" font-size="16" font-weight="700">Describe the drawing</text>
  </g>
  <g transform="translate(620 231)">
    <rect width="240" height="220" rx="22" fill="#fffdf7" stroke="#e4d5c3"/>
    <text x="19" y="29" font-size="13" fill="#23584c" font-weight="700" letter-spacing="1.4">03  STICKER SHEET</text>
