      <use href="#sleep" y="35" width="30" height="30"/><use href="#smile" x="35" y="35" width="30" height="30"/><use href="#wow" x="70" y="35" width="30" height="30"/>
      <use href="#wow" y="70" width="30" height="30"/><use href="#sleep" x="35" y="70" width="30" height="30"/><use href="#smile" x="70" y="70" width="30" height="30"/>
    </g>
