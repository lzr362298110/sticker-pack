<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Sticker Pack workflow</title>
<desc id="desc">Character image, style analysis and prompt, nine-panel sticker sheet, 240 pixel PNG and GIF.</desc>
<defs>
  <pattern id="dot" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8d7969" opacity=".18"/></pattern>
