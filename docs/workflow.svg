  </g>
  <g transform="translate(902 231)">
    <rect width="240" height="220" rx="22" fill="#fffdf7" stroke="#e4d5c3"/>
    <text x="19" y="29" font-size="13" fill="#23584c" font-weight="700" letter-spacing="1.4">04  EXPORT</text>
    <rect x="60" y="61" width="110" height="99" rx="14" fill="#deeee4"/>
    <rect x="69" y="50" width="110" height="99" rx="14" fill="#fff7e9" stroke="#23584c" stroke-width="2"/>
    <use href="#smile" x="87" y="60" width="76" height="70"/>
    <rect x="120" y="128" width="64" height="22" rx="11" fill="#23584c"/>
    <text x="152" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#fff6e8">PNG · GIF</text>
    <text x="19" y="194" font-size="16" font-weight="700">Prepare 240 × 240 files</text>
